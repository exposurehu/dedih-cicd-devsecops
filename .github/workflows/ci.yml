name: CI

# The workflow runs on every pull request, and again on main after a merge.
#
# pull_request already re-runs on every push to a branch that has an open pull
# request, so triggering on every push as well would only run the same commit
# twice. The run on main is not a duplicate of the pull request run: a merge can
# break something that neither branch broke on its own, and this is what
# catches it.
#
# workflow_dispatch adds a manual run from the Actions UI, on any branch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, at the workflow level. Every job starts with read only
# access to the repository, and a job that needs more has to ask for it. The
# default without this block is whatever the repository settings allow, which
# in an older repository can still be read and write on everything.
permissions:
  contents: read

jobs:

  # ----------------------------------------------------------------------------
  # Install, lint, test. This is the job that branch protection makes a required
  # check, so a pull request cannot be merged while it is red.
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # actions/checkout is published by GitHub itself and is referenced by
        # its major version tag. A tag can be moved to different code, a commit
        # SHA cannot, so the stricter policy is to pin every action to a SHA.
        # docker.yml does that for the two actions that are not published by
        # GitHub.
        uses: actions/checkout@v7

      - name: Set up Python and install the dependencies
        # A composite action. The steps live in .github/actions/setup and run
        # inside this job.
        uses: ./.github/actions/setup

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest

  # ----------------------------------------------------------------------------
  # Secret scanning, on every proposed change. This is the fast feedback: a
  # credential in a pull request is reported within seconds, before anyone
  # reviews the code. A credential pushed to a branch with no pull request goes
  # unnoticed until one is opened, which is a real property of this setup and
  # the reason push protection, which acts earlier, is worth having as well.
  #
  # The same scan is also a hard gate in docker.yml and deploy.yml, where it
  # decides whether an image gets built and whether anything gets deployed. The
  # steps live in .github/actions/secret-scan so there is one definition of
  # them.
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Least privilege at the job level. This job reads the repository and
    # writes nothing back, so that is all it asks for.
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Scan for secrets
        uses: ./.github/actions/secret-scan

name: CI

# The workflow runs on every push and on every pull request, so both the main
# branch and the pull requests get a green or red signal. workflow_dispatch
# also allows a manual run from the Actions UI.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Least privilege, at the workflow level. Every job starts with read only
# access to the repository, and a job that needs more has to ask for it. The
# default without this block is whatever the repository settings allow, which
# in an older repository can still be read and write on everything.
permissions:
  contents: read

jobs:

  # ----------------------------------------------------------------------------
  # Install, lint, test. This is the job that branch protection makes a required
  # check, so a pull request cannot be merged while it is red.
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # actions/checkout is published by GitHub itself and is referenced by
        # its major version tag. A tag can be moved to different code, a commit
        # SHA cannot, so the stricter policy is to pin every action to a SHA.
        # docker.yml does that for the two actions that are not published by
        # GitHub.
        uses: actions/checkout@v7

      - name: Set up Python and install the dependencies
        # A composite action. The steps live in .github/actions/setup and run
        # inside this job.
        uses: ./.github/actions/setup

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest

  # ----------------------------------------------------------------------------
  # Secret scanning, on every push and every pull request. This is the fast
  # feedback: a credential that lands in the repository is reported within
  # seconds of the push.
  #
  # The same scan is also a hard gate in docker.yml and deploy.yml, where it
  # decides whether an image gets built and whether anything gets deployed. The
  # steps live in .github/actions/secret-scan so there is one definition of
  # them.
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Least privilege at the job level. This job reads the repository and
    # writes nothing back, so that is all it asks for.
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Scan for secrets
        uses: ./.github/actions/secret-scan

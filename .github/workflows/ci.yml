name: CI

# The workflow runs on every push and on every pull request, so both the main
# branch and the pull requests get a green or red signal. workflow_dispatch
# also allows a manual run from the Actions UI.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# Least privilege, at the workflow level. Every job starts with read only
# access to the repository, and a job that needs more has to ask for it. The
# default without this block is whatever the repository settings allow, which
# in an older repository can still be read and write on everything.
permissions:
  contents: read

jobs:

  # ----------------------------------------------------------------------------
  # Install, lint, test. This is the job that branch protection makes a required
  # check, so a pull request cannot be merged while it is red.
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # actions/checkout is published by GitHub itself and is referenced by
        # its major version tag. A tag can be moved to different code, a commit
        # SHA cannot, so the stricter policy is to pin every action to a SHA.
        # docker.yml does that for the two actions that are not published by
        # GitHub.
        uses: actions/checkout@v7

      - name: Set up Python and install the dependencies
        # A composite action. The steps live in .github/actions/setup and run
        # inside this job.
        uses: ./.github/actions/setup

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Tests (pytest)
        run: pytest

  # ----------------------------------------------------------------------------
  # Secret scanning. gitleaks looks for values that have the shape of a
  # credential: API keys, tokens, private keys.
  #
  # The gitleaks binary is MIT licensed and free. The gitleaks/gitleaks-action
  # wrapper has been paid for organisations since 2024 and would ask for a
  # GITLEAKS_LICENSE secret, so the binary is installed directly from the
  # releases and pinned to an exact version.
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan the working tree
        # gitleaks dir scans the files as they are now. gitleaks git scans the
        # commit history instead, and would keep failing forever once a
        # credential has been committed, because deleting the value from the
        # file does not remove it from the history. That is a true statement
        # about the leak and a bad merge gate, so the gate looks at the current
        # state and the history scan is run by hand when a leak is found.
        run: |
          gitleaks dir . \
            --no-banner \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json

      - name: Upload the report
        # if: always() so the report is kept exactly when the scan failed and
        # somebody needs to see what was found.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

name: Deploy to an environment

# ----------------------------------------------------------------------------
# A deployment pipeline. Nothing is deployed anywhere: the last job starts the
# application on the runner with the secret injected and asks the application
# what it knows about its own configuration. That is enough to show what a
# deployment has to get right, without needing a server to deploy to.
#
# Three jobs, and the shape is the lesson as much as the content:
#
#   secret-scan  ---\
#                     ---> deploy
#   verify       ---/
#
# Nothing is deployed from a tree that contains a credential, and nothing is
# deployed from code whose tests fail. Both gates run at the same time, and
# either one failing means the deployment never starts.
#
# This file is a copy of deploy.yml and differs from it in exactly three
# places: the workflow name above, the input block below, and the environment:
# line on the deploy job. Everything else is identical on purpose. Diff the two
# files and what is left is the entire cost of putting a pipeline behind a
# GitHub Environment.
#
# Manual start: Actions > Deploy to an environment > Run workflow, then pick
# the branch and the environment.
# ----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy to"
        required: true
        # type: environment makes GitHub fill the dropdown on the Run workflow
        # screen with the environments that exist in this repository. Nothing
        # lists them here, so creating one in Settings is enough for it to show
        # up. With no environments created yet the dropdown is empty and the
        # run cannot be started.
        type: environment

permissions:
  contents: read

jobs:

  # ----------------------------------------------------------------------------
  # Gate one: no credential in the working tree. The steps live in
  # .github/actions/secret-scan and are the same ones ci.yml and docker.yml run.
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Scan for secrets
        uses: ./.github/actions/secret-scan

  # ----------------------------------------------------------------------------
  # Gate two: the tests pass. This one is a reusable workflow rather than a list
  # of steps, so it runs as its own job on its own runner and shows up
  # separately in the Actions UI. The same checks are defined once and called
  # from wherever they are needed.
  # ----------------------------------------------------------------------------
  verify:
    uses: ./.github/workflows/reusable-checks.yml

  # ----------------------------------------------------------------------------
  # The deployment.
  #
  # needs: names both gates. A gate that fails does not make this job fail, it
  # makes it never run at all: the Actions UI shows it as skipped. Nothing was
  # built, nothing was shipped, nothing has to be undone.
  #
  # The step that starts the application is where the secret enters the picture,
  # and its env: block is the only place the two worlds touch. On the left is
  # the name of the environment variable the process will see. On the right is
  # where GitHub takes the value from. The application itself knows nothing
  # about GitHub: it reads an environment variable, exactly as it would from
  # export on a laptop, from docker run -e in a container, or from the app
  # settings of a hosting service.
  #
  # The two names being identical is a convention, not a rule. Writing
  # OPENAI_API_KEY: ${{ secrets.SOMETHING_ELSE }} would work the same way.
  #
  # environment: is the one line that separates this file from deploy.yml. It
  # does two things. The job can now read the secrets and variables of that
  # environment, and a secret defined there wins over a repository secret of
  # the same name, so the same expression resolves to a different value per
  # environment. And the protection rules of that environment apply, so a
  # required reviewer holds this job in a waiting state until somebody approves
  # it. Branch protection decides what may be merged, an environment decides
  # what may be released.
  #
  # A reusable workflow cannot carry this keyword. on.workflow_call does not
  # support environment:, so the calling job cannot set one, and an environment
  # scoped secret never reaches it. That is why verify above is a reusable
  # workflow and the Python setup below is a composite action: a composite
  # action runs inside this job and is not affected.
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to ${{ inputs.target }}
    needs: [secret-scan, verify]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python and install the dependencies
        uses: ./.github/actions/setup

      - name: What the log shows of the secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "The value, printed straight into the log: $OPENAI_API_KEY"
          echo "The length of the same value: ${#OPENAI_API_KEY} characters"
          echo
          echo "GitHub replaces a known secret value with *** in the log. The length shows"
          echo "the value is really there. Masking is a safety net, not a control: a step"
          echo "that transforms the value, base64 for example, prints it in the clear."

      - name: Start the application and ask it about its configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          echo "GET /config answers:"
          curl -sf http://127.0.0.1:8000/config
          echo

          echo "The endpoint reports whether a key is configured. It never returns the"
          echo "value, so this output is safe to keep in a log."

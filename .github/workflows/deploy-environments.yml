name: Deploy to an environment

# A deployment pipeline. Nothing is deployed anywhere: the last job starts the
# application on the runner with the secret injected and asks it what it knows
# about its own configuration.
#
#   secret-scan  ---\
#                     ---> deploy
#   verify       ---/
#
# This is a copy of deploy.yml with a GitHub Environment added. Diff the two
# files: the difference is four lines.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy to"
        required: true
        # GitHub fills this dropdown from the environments that exist in the
        # repository. With none created the list is empty and the run cannot
        # start.
        type: environment

permissions:
  contents: read

jobs:

  # No credential in the working tree. Same steps as ci.yml and docker.yml.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Scan for secrets
        uses: ./.github/actions/secret-scan

  # The tests pass. A reusable workflow rather than a list of steps, so it runs
  # as its own job and can be called from more than one workflow.
  verify:
    uses: ./.github/workflows/reusable-checks.yml

  # A gate that fails does not make this job fail, it makes it never run: the
  # Actions UI shows it as skipped.
  # environment: gives the job the secrets and variables of that environment,
  # where a secret of the same name wins over the repository one, and applies
  # its protection rules. A reusable workflow cannot carry this keyword, which
  # is why verify above is one and the setup below is a composite action.
  deploy:
    name: Deploy to ${{ inputs.target }}
    needs: [secret-scan, verify]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python and install the dependencies
        uses: ./.github/actions/setup

      - name: What the log shows of the secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "The value, printed straight into the log: $OPENAI_API_KEY"
          echo "The length of the same value: ${#OPENAI_API_KEY} characters"
          echo
          echo "GitHub replaces a known secret value with *** in the log. The length shows"
          echo "the value is really there. Masking is a safety net, not a control: a step"
          echo "that transforms the value, base64 for example, prints it in the clear."

      # The env: block below is the only place the two worlds touch. On the
      # left is the environment variable the process will see, on the right is
      # where GitHub takes the value from. The application knows nothing about
      # GitHub, it reads an environment variable.
      - name: Start the application and ask it about its configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          echo "GET /config answers:"
          curl -sf http://127.0.0.1:8000/config
          echo

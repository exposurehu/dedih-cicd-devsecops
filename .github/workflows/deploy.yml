name: Deploy

# ----------------------------------------------------------------------------
# Simulated deployment. Nothing is deployed anywhere: the job starts the
# application on the runner with the secret injected and asks the application
# what it knows about its own configuration. That is enough to show:
#
#   1. how a secret reaches a job, and what the log shows of it
#   2. the deployment gate an environment adds, on top of the merge gate that
#      branch protection adds
#   3. a reusable workflow and a composite action next to each other
#
# Manual start only: Actions > Deploy > Run workflow.
# ----------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ----------------------------------------------------------------------------
  # A reusable workflow instead of a list of steps. It runs as its own job, on
  # its own runner, which is why it shows up separately in the Actions UI. A
  # deploy pipeline that runs the tests before deploying is the ordinary reason
  # to reach for one: the same checks, defined once, called from more than one
  # workflow.
  # ----------------------------------------------------------------------------
  verify:
    uses: ./.github/workflows/reusable-checks.yml

  # ----------------------------------------------------------------------------
  # The deployment job.
  #
  # environment: staging does two things. It applies the protection rules of
  # that environment, so a required reviewer holds the job in a waiting state
  # until somebody approves it. And it gives the job access to the secrets of
  # that environment, on top of the repository secrets it can already see.
  #
  # A reusable workflow could not do this. on.workflow_call does not support
  # environment:, so the calling job cannot set one, and an environment scoped
  # secret never reaches it. A composite action runs inside this job, so it is
  # not affected.
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python and install the dependencies
        # A composite action. Its steps run inside this job.
        uses: ./.github/actions/setup

      - name: What the log shows of the secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "The value, printed straight into the log: $OPENAI_API_KEY"
          echo "The length of the same value: ${#OPENAI_API_KEY} characters"
          echo
          echo "GitHub replaces a known secret value with *** in the log. The length shows"
          echo "the value is really there. Masking is a safety net, not a control: a step"
          echo "that transforms the value, base64 for example, prints it in the clear."

      - name: Start the application and ask it about its configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          echo "GET /config answers:"
          curl -sf http://127.0.0.1:8000/config
          echo

          echo "The endpoint reports whether a key is configured. It never returns the"
          echo "value, so this output is safe to keep in a log."

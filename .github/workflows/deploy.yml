name: Deploy

# ----------------------------------------------------------------------------
# A deployment pipeline. Nothing is deployed anywhere: the last job starts the
# application on the runner with the secret injected and asks the application
# what it knows about its own configuration. That is enough to show what a
# deployment has to get right, without needing a server to deploy to.
#
# Three jobs, and the shape is the lesson as much as the content:
#
#   secret-scan  ---\
#                     ---> deploy-staging
#   verify       ---/
#
# Nothing is deployed from a tree that contains a credential, and nothing is
# deployed from code whose tests fail. Both gates run at the same time, and
# either one failing means the deployment never starts.
#
# Manual start: Actions > Deploy > Run workflow, then pick the branch.
# ----------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ----------------------------------------------------------------------------
  # Gate one: no credential in the working tree. The steps live in
  # .github/actions/secret-scan and are the same ones ci.yml and docker.yml run.
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Scan for secrets
        uses: ./.github/actions/secret-scan

  # ----------------------------------------------------------------------------
  # Gate two: the tests pass. This one is a reusable workflow rather than a list
  # of steps, so it runs as its own job on its own runner and shows up
  # separately in the Actions UI. The same checks are defined once and called
  # from wherever they are needed.
  # ----------------------------------------------------------------------------
  verify:
    uses: ./.github/workflows/reusable-checks.yml

  # ----------------------------------------------------------------------------
  # The deployment.
  #
  # needs: names both gates. A gate that fails does not make this job fail, it
  # makes it never run at all: the Actions UI shows it as skipped. Nothing was
  # built, nothing was shipped, nothing has to be undone.
  #
  # environment: staging applies the protection rules of that environment, so a
  # required reviewer holds the job in a waiting state until somebody approves
  # it. That is a second kind of gate: branch protection decides what may be
  # merged, an environment decides what may be released.
  #
  # A reusable workflow could not carry that keyword. on.workflow_call does not
  # support environment:, so the calling job cannot set one. A composite action
  # runs inside this job and is not affected, which is why the Python setup
  # below is a composite action and the checks above are a reusable workflow.
  # ----------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging
    needs: [secret-scan, verify]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python and install the dependencies
        uses: ./.github/actions/setup

      - name: What the log shows of the secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "The value, printed straight into the log: $OPENAI_API_KEY"
          echo "The length of the same value: ${#OPENAI_API_KEY} characters"
          echo
          echo "GitHub replaces a known secret value with *** in the log. The length shows"
          echo "the value is really there. Masking is a safety net, not a control: a step"
          echo "that transforms the value, base64 for example, prints it in the clear."

      - name: Start the application and ask it about its configuration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          echo "GET /config answers:"
          curl -sf http://127.0.0.1:8000/config
          echo

          echo "The endpoint reports whether a key is configured. It never returns the"
          echo "value, so this output is safe to keep in a log."

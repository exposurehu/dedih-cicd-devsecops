name: Docker build

# ----------------------------------------------------------------------------
# Docker image build, smoke test and vulnerability scan
# ----------------------------------------------------------------------------
# Manual start only: Actions > Docker build > Run workflow.
#
# What the workflow does:
#   1. scans the working tree for credentials, and stops here if it finds one
#   2. builds the image from docker/Dockerfile
#   3. starts the container and calls the endpoints for real
#   4. scans the built image twice, once as a gate and once as a report
#
# Step 3 matters: an image that builds is not necessarily an image that starts.
# A green build is worth something when it also checks that the artifact it
# produced works.
#
# The last two are the same scanner with different filters, and the gap
# between the two numbers is the point. The gate looks at what we chose, the
# report looks at what we actually ship.
# ----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (left empty, the short commit SHA is used)"
        required: false
        default: ""

permissions:
  contents: read

jobs:

  # ----------------------------------------------------------------------------
  # The gate in front of the build. A credential that is in the working tree
  # when the image is built gets copied into a layer, and a layer is readable by
  # anyone who can pull the image. Deleting the file later does not remove it
  # from the layer, exactly as deleting it from a file does not remove it from
  # the git history. So nothing gets built until this job is green.
  # ----------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Scan for secrets
        uses: ./.github/actions/secret-scan

  docker-build:
    name: Docker build, smoke test and image scan
    runs-on: ubuntu-latest

    # needs: makes this job wait for the other one and, more to the point, skip
    # entirely if that one fails. A skipped job is not a failed job: it never
    # started. That is the difference between a check that reports a problem and
    # a gate that stops the work.
    needs: secret-scan

    # Least privilege: this job only reads the repository, it writes nothing
    # back. Pushing to a registry would need more, see the end of the file.
    permissions:
      contents: read

    env:
      # Every tool that gets installed is pinned to an exact version. The flags
      # of a scanner change between releases, so an unpinned scanner can turn a
      # green pipeline red without a single line of the repository changing.
      TRIVY_VERSION: "0.74.0"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Determine the image tag
        id: tag
        # The user input is passed to the shell through an environment
        # variable, not by substituting ${{ }} into the script. Written into
        # the script, the text typed into the input box would run as a command
        # on the runner (script injection). It is the same "do not trust the
        # input" principle that the Pydantic validation stands for on the
        # application side.
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          else
            TAG="$INPUT_TAG"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "The build tag: $TAG"

      - name: Set up Docker Buildx
        # These two actions are not published by GitHub, so they are pinned to
        # a commit SHA and the version is written next to it as a comment. A
        # tag can be moved to different code, a SHA cannot. This is the
        # stricter of the two policies in this repository, see ci.yml.
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:

          # The context is the repository root, the Dockerfile is in the
          # docker/ directory. Two separate parameters.
          context: .
          file: docker/Dockerfile
          tags: dedih-demo:${{ steps.tag.outputs.value }}

          # push: false = only building for now, not uploading anywhere
          # load: true  = the image goes into the local Docker of the runner,
          #               so the next steps can start and scan it
          push: false
          load: true

          # Layer caching in the GitHub Actions cache. From the second run the
          # build is considerably faster.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size and layers
        env:
          TAG: ${{ steps.tag.outputs.value }}
        # docker history shows which instruction produced which layer. The
        # multi-stage build is visible here: the tools used for installing are
        # not part of the finished image.
        run: |
          docker images dedih-demo
          echo
          docker history "dedih-demo:$TAG"

      - name: Smoke test
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker run -d --name dedih-demo -p 8000:8000 "dedih-demo:$TAG"

          # uvicorn does not start instantly, so we wait for it. At most 15
          # seconds, after that the step fails.
          for _ in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          echo "GET / answers:"
          curl -sf http://127.0.0.1:8000/
          echo

          echo "POST /greet answers:"
          curl -sf -X POST http://127.0.0.1:8000/greet \
            -H "Content-Type: application/json" \
            -d '{"name":"DEDIH"}'
          echo

      - name: Container log and cleanup
        # if: always() = run this even if the smoke test failed. The container
        # log is most interesting exactly when something did not work.
        if: always()
        run: |
          echo "The log of the container:"
          docker logs dedih-demo || true
          docker rm -f dedih-demo || true

      # --------------------------------------------------------------------
      # The scanner. Trivy reads the built image: the operating system
      # packages of the base layer and the Python packages in the virtualenv
      # at /opt/venv alike. That is why there is no separate tool reading
      # requirements.txt: it would be the same check twice, on a smaller
      # surface.
      # --------------------------------------------------------------------
      - name: Install Trivy
        run: |
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz trivy
          sudo mv trivy /usr/local/bin/
          trivy --version

      - name: Scan the image, gate
        env:
          TAG: ${{ steps.tag.outputs.value }}
        # The gate. Three filters, and each one has a reason:
        #
        #   --pkg-types library   only our own packages, not the base operating
        #                         system. We chose these, we can change them.
        #   --ignore-unfixed      only findings that have a fixed version. A
        #                         finding with no fix cannot be acted on today.
        #   --severity HIGH,CRITICAL   the ones worth stopping a release for.
        #
        # --exit-code 1 makes the job red when something gets through the
        # filters. What blocks you has to be actionable: a gate that fires on
        # things nobody can fix gets switched off within a month, and then you
        # have neither the gate nor the information.
        #
        # The remediation is to raise the pin in requirements.txt to the fixed
        # version, then run the tests. There is no automatic fix command.
        #
        # The output is JSON rather than Trivy's own table, because that table
        # is 200 columns wide and wraps into an unreadable mess in the Actions
        # log. The compact list below fits on a projector. The full table is in
        # the uploaded artifact for anybody who wants it.
        run: |
          set +e
          trivy image \
            --scanners vuln \
            --pkg-types library \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --skip-version-check \
            --format json \
            --output trivy-gate.json \
            "dedih-demo:$TAG"
          STATUS=$?
          set -e

          jq -r '.Results[]?.Vulnerabilities[]?
                 | [.PkgName, .InstalledVersion, .VulnerabilityID, .Severity, .FixedVersion]
                 | @tsv' trivy-gate.json > gate-rows.tsv

          COUNT=$(wc -l < gate-rows.tsv | tr -d " ")

          echo "=================================================================="
          echo "GATE   our own packages, fixable only, HIGH and CRITICAL only"
          echo "=================================================================="
          awk -F'\t' 'BEGIN { printf "%-12s %-10s %-18s %-9s %s\n", "PACKAGE", "INSTALLED", "VULNERABILITY", "SEVERITY", "FIXED IN" }
                      { printf "%-12s %-10s %-18s %-9s %s\n", $1, $2, $3, $4, $5 }' gate-rows.tsv
          echo "------------------------------------------------------------------"
          echo "$COUNT finding(s). The build stops here."

          {
            echo "## Image scan, gate"
            echo
            echo "Our own packages, fixable findings only, HIGH and CRITICAL only."
            echo "**$COUNT finding(s).**"
            echo
            echo "| Package | Installed | Vulnerability | Severity | Fixed in |"
            echo "| --- | --- | --- | --- | --- |"
            awk -F'\t' '{ printf "| %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5 }' gate-rows.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          exit $STATUS

      - name: Scan the image, report
        # if: always() so the report is produced even when the gate above
        # failed. This is the step that answers "what do we actually ship", and
        # that question is most interesting when something is wrong.
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.value }}
        # The report. No filters at all: the base operating system is in it, the
        # findings with no fix are in it, every severity is in it. --exit-code 0
        # means it never fails the build. What informs you can be complete.
        #
        # --skip-db-update because the gate already downloaded the vulnerability
        # database into the cache of this runner a minute ago.
        #
        # The log gets counts, not rows. Two hundred and thirty nine rows of
        # Trivy's own table is not something anyone reads. The full table goes
        # into the artifact.
        run: |
          trivy image \
            --scanners vuln \
            --pkg-types os,library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            --skip-db-update \
            --no-progress \
            --skip-version-check \
            --format json \
            --output trivy-report.json \
            "dedih-demo:$TAG"

          trivy image \
            --scanners vuln \
            --pkg-types os,library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 \
            --skip-db-update \
            --no-progress \
            --skip-version-check \
            --format table \
            --output trivy-report.txt \
            "dedih-demo:$TAG"

          OS_ALL=$(jq '[.Results[] | select(.Class == "os-pkgs") | .Vulnerabilities // [] | length] | add // 0' trivy-report.json)
          OS_FIX=$(jq '[.Results[] | select(.Class == "os-pkgs") | .Vulnerabilities // [] | .[] | select(.FixedVersion != null)] | length' trivy-report.json)
          LIB_ALL=$(jq '[.Results[] | select(.Class == "lang-pkgs") | .Vulnerabilities // [] | length] | add // 0' trivy-report.json)
          LIB_FIX=$(jq '[.Results[] | select(.Class == "lang-pkgs") | .Vulnerabilities // [] | .[] | select(.FixedVersion != null)] | length' trivy-report.json)
          TOTAL=$((OS_ALL + LIB_ALL))
          TOTAL_FIX=$((OS_FIX + LIB_FIX))

          N_CRITICAL=$(jq '[.Results[].Vulnerabilities // [] | .[] | select(.Severity == "CRITICAL")] | length' trivy-report.json)
          N_HIGH=$(jq '[.Results[].Vulnerabilities // [] | .[] | select(.Severity == "HIGH")] | length' trivy-report.json)
          N_MEDIUM=$(jq '[.Results[].Vulnerabilities // [] | .[] | select(.Severity == "MEDIUM")] | length' trivy-report.json)
          N_LOW=$(jq '[.Results[].Vulnerabilities // [] | .[] | select(.Severity == "LOW")] | length' trivy-report.json)
          N_UNKNOWN=$(jq '[.Results[].Vulnerabilities // [] | .[] | select(.Severity == "UNKNOWN")] | length' trivy-report.json)

          echo "=================================================================="
          echo "REPORT   everything in the image, nothing filtered out"
          echo "=================================================================="
          printf "%-28s %10s %12s\n" "" "FINDINGS" "WITH A FIX"
          printf "%-28s %10s %12s\n" "Base operating system" "$OS_ALL" "$OS_FIX"
          printf "%-28s %10s %12s\n" "Python packages" "$LIB_ALL" "$LIB_FIX"
          echo "------------------------------------------------------------------"
          printf "%-28s %10s %12s\n" "Total" "$TOTAL" "$TOTAL_FIX"
          echo
          echo "CRITICAL $N_CRITICAL   HIGH $N_HIGH   MEDIUM $N_MEDIUM   LOW $N_LOW   UNKNOWN $N_UNKNOWN"
          echo "------------------------------------------------------------------"
          echo "This step never fails. The gate stopped the build on a subset of"
          echo "these: the ones in our own packages that have a fix today."

          {
            echo "## Image scan, report"
            echo
            echo "Everything the image contains. This step never fails the build."
            echo
            echo "| | Findings | With a fix |"
            echo "| --- | --- | --- |"
            echo "| Base operating system | $OS_ALL | $OS_FIX |"
            echo "| Python packages | $LIB_ALL | $LIB_FIX |"
            echo "| **Total** | **$TOTAL** | **$TOTAL_FIX** |"
            echo
            echo "| Severity | Count |"
            echo "| --- | --- |"
            echo "| CRITICAL | $N_CRITICAL |"
            echo "| HIGH | $N_HIGH |"
            echo "| MEDIUM | $N_MEDIUM |"
            echo "| LOW | $N_LOW |"
            echo "| UNKNOWN | $N_UNKNOWN |"
            echo
            echo "The full Trivy table is in the **trivy-reports** artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-reports
          path: |
            trivy-gate.json
            trivy-report.txt
            trivy-report.json
          if-no-files-found: ignore

# ----------------------------------------------------------------------------
# AND ONCE THE IMAGE IS BUILT, WHAT HAPPENS TO IT?
# ----------------------------------------------------------------------------
# Up to this point the workflow builds the image, tries it out, scans it and
# then throws it away. In a real project the image goes into a registry after
# the build, and the environment that runs it (a server, Kubernetes, App
# Service) pulls it from there.
#
# Before any registry, two general rules:
#
#   1. Do NOT use only the "latest" tag. latest can be repointed, and later
#      nobody can say which commit is running in production. The commit SHA is
#      unambiguous: dedih-demo:a1b2c3d. latest can go next to it, not instead
#      of it.
#   2. Never write the registry password into the workflow file. Store it as a
#      repository secret (Settings > Secrets and variables > Actions) and
#      reference it as ${{ secrets.NAME }}.
#
# ----------------------------------------------------------------------------
# A) GitHub Packages (GHCR), the simplest one when the code is already on GitHub
# ----------------------------------------------------------------------------
# It needs no separate account and no separate secret: GITHUB_TOKEN exists
# automatically in every workflow run. Only the permission has to be granted.
#
#     permissions:
#       contents: read
#       packages: write          # <- this is what uploading the image needs
#
#     - name: Log in to GHCR
#       uses: docker/login-action@v3
#       with:
#         registry: ghcr.io
#         username: ${{ github.actor }}
#         password: ${{ secrets.GITHUB_TOKEN }}
#
#         # and in the build step:
#         push: true
#         tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
#
# The image then shows up in the Packages section of the repository. Note that
# GHCR only accepts lowercase names, so an uppercase letter in the GitHub user
# name has to be lowercased first.
#
# ----------------------------------------------------------------------------
# B) Docker Hub, the best known public registry
# ----------------------------------------------------------------------------
# This one needs an account of your own and two repository secrets:
#   DOCKERHUB_USERNAME  - the Docker Hub user name
#   DOCKERHUB_TOKEN     - an Access Token (Docker Hub > Account Settings >
#                         Personal access tokens), NOT the account password
#
#     - name: Log in to Docker Hub
#       uses: docker/login-action@v3
#       with:
#         username: ${{ secrets.DOCKERHUB_USERNAME }}
#         password: ${{ secrets.DOCKERHUB_TOKEN }}
#
#         push: true
#         tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dedih-demo:${{ steps.tag.outputs.value }}
#
# An access token rather than a password, because a token can be revoked
# without changing the account password, and its rights can be limited.
#
# ----------------------------------------------------------------------------
# C) Azure Container Registry (ACR), a private company registry
# ----------------------------------------------------------------------------
# There are two ways. The simpler one is the same pattern as above, with a user
# name and a password:
#
#     - name: Log in to ACR
#       uses: docker/login-action@v3
#       with:
#         registry: <registry-name>.azurecr.io
#         username: ${{ secrets.ACR_USERNAME }}
#         password: ${{ secrets.ACR_PASSWORD }}
#
#         push: true
#         tags: <registry-name>.azurecr.io/dedih-demo:${{ steps.tag.outputs.value }}
#
# The current approach is an OIDC federated credential: there is no stored
# password at all. GitHub receives a short lived token during the run, Azure
# verifies it, and it expires within minutes.
#
#     permissions:
#       contents: read
#       id-token: write          # <- this is what the OIDC token needs
#
#     - name: Sign in to Azure (OIDC, without a password)
#       uses: azure/login@v2
#       with:
#         client-id: ${{ secrets.AZURE_CLIENT_ID }}
#         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
#         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
#
#     - name: ACR login
#       run: az acr login --name <registry-name>
#
# This is the continuation of the secrets block: the safest secret is the one
# that does not exist. What is not stored cannot be leaked.
#
# ----------------------------------------------------------------------------
# D) What usually follows the push
# ----------------------------------------------------------------------------
#   - Image scanning: the two Trivy steps above already do this, and in a
#     pipeline that pushes they belong before the push, so a vulnerable image
#     never leaves the build.
#   - SBOM (Software Bill of Materials): an itemised list of what is in the
#     image. build-push-action can generate one (sbom: true), and Trivy can as
#     well (--format cyclonedx or --format spdx-json).
#   - Signing: cosign puts a digital signature on the image, so the running
#     environment can verify that our pipeline built it and nobody swapped it.
#   - Deploy: the running environment pulls the image from the registry. That
#     is the CD part, and it is usually a separate workflow.
#   - Multiple architectures: platforms: linux/amd64,linux/arm64 produces an
#     image that also runs on Apple Silicon machines. load: true does not work
#     then, because more than one image is built at once.
# ----------------------------------------------------------------------------

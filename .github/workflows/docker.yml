name: Docker build

# ----------------------------------------------------------------------------
# Docker image build demo
# ----------------------------------------------------------------------------
# Ez a workflow szándékosan csak kézzel indítható (workflow_dispatch).
# Indítás: GitHub > Actions > "Docker build" > Run workflow gomb.
#
# Amit a workflow csinál:
#   1. buildeli az image-et a docker/Dockerfile alapján
#   2. elindítja a konténert, és tényleg meghívja a két végpontot
#
# A 2. lépés fontos: attól, hogy egy image megépül, még nem biztos, hogy el
# is indul. A "zöld build" akkor ér valamit, ha azt is ellenőrzi, hogy a
# kiszállított artifact működik.
# ----------------------------------------------------------------------------

on:
  # A workflow_dispatch lehetővé teszi, hogy a GitHub Actions UI-ról kézzel indítsuk a workflow-t.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (üresen hagyva a rövid commit SHA lesz)"
        required: false
        default: ""

jobs:
  docker-build:
    name: Docker build és smoke test
    runs-on: ubuntu-latest

    # Least privilege: ez a job csak beolvassa a repot, semmit nem ír vissza.
    # Ha később registry-be is push-olnánk, itt kellene bővíteni (lásd a fájl
    # végén a "packages: write" sort).
    permissions:
      contents: read

    steps:
      - name: Repo letöltése
        uses: actions/checkout@v4

      - name: Image tag meghatározása
        id: tag
        # A felhasználói inputot env változón keresztül adjuk át a shell-nek,
        # nem közvetlenül a ${{ }} behelyettesítéssel. Ha a szkriptbe írnánk
        # be, a beírt szöveg parancsként futna le a runneren (script
        # injection). Ez ugyanaz a "ne bízz a bemenetben" elv, amit a Pydantic
        # validáció is képvisel az alkalmazás oldalán.
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -z "$INPUT_TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          else
            TAG="$INPUT_TAG"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "A build tag: $TAG"

      - name: Docker Buildx beállítása
        uses: docker/setup-buildx-action@v3

      - name: Image build
        uses: docker/build-push-action@v6
        with:

          # A context a repo gyökere, a Dockerfile viszont a docker/ mappában
          # van. A kettő külön paraméter.
          context: .
          file: docker/Dockerfile
          tags: dedih-demo:${{ steps.tag.outputs.value }}

          # push: false = most csak építünk, nem töltjük fel sehova
          # load: true  = az image kerüljön be a runner helyi Docker-ébe, hogy
          #               a következő lépésben el tudjuk indítani
          push: false
          load: true

          # A rétegek cache-elése a GitHub Actions cache-ében. A második
          # futástól a build lényegesen gyorsabb.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image mérete és rétegei
        env:
          TAG: ${{ steps.tag.outputs.value }}
        # A docker history megmutatja, melyik utasítás mekkora réteget csinált.
        # Itt látszik, hogy a multi-stage build miatt a telepítéshez használt
        # eszközök nincsenek benne a kész image-ben.
        run: |
          docker images dedih-demo
          echo
          docker history "dedih-demo:$TAG"

      - name: Smoke test
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          docker run -d --name dedih-demo -p 8000:8000 "dedih-demo:$TAG"

          # Az uvicorn indulása nem azonnali, ezért megvárjuk. Legfeljebb 15
          # másodpercig próbálkozunk, utána a lépés hibára fut.
          for _ in $(seq 1 15); do
            if curl -sf http://127.0.0.1:8000/ > /dev/null; then
              break
            fi
            sleep 1
          done

          echo "GET / válasza:"
          curl -sf http://127.0.0.1:8000/
          echo

          echo "POST /greet válasza:"
          curl -sf -X POST http://127.0.0.1:8000/greet \
            -H "Content-Type: application/json" \
            -d '{"name":"DEDIH"}'
          echo

      - name: Konténer logja és takarítás
        # if: always() = akkor is fusson le, ha a smoke test elbukott. Éppen
        # akkor a legérdekesebb a konténer logja, amikor valami nem működik.
        if: always()
        run: |
          echo "A konténer logja:"
          docker logs dedih-demo || true
          docker rm -f dedih-demo || true

# ----------------------------------------------------------------------------
# ÉS HA MEGÉPÜLT AZ IMAGE, MI TÖRTÉNIK VELE?
# ----------------------------------------------------------------------------
# A workflow eddig a pontig megépíti és kipróbálja az image-et, aztán eldobja.
# Éles projektben a build után az image egy registry-be kerül, ahonnan a
# futtató környezet (szerver, Kubernetes, App Service) le tudja húzni.
#
# Mielőtt bármelyik registry jönne, két általános szabály:
#
#   1. NE csak "latest" tag-et használj. A latest átírható, és később nem
#      lehet megmondani, melyik commit fut éppen élesben. A commit SHA
#      egyértelmű: dedih-demo:a1b2c3d. A latest emellé mehet, nem helyette.
#   2. A registry jelszavát soha ne írd be a workflow fájlba. Repository
#      secret-ként tedd el (Settings > Secrets and variables > Actions), és
#      ${{ secrets.NEV }} formában hivatkozz rá.
#
# ----------------------------------------------------------------------------
# A) GitHub Packages (GHCR) - a legegyszerűbb, ha a kód már GitHubon van
# ----------------------------------------------------------------------------
# Nem kell hozzá külön fiók és külön secret: a GITHUB_TOKEN automatikusan
# létezik minden workflow futásban. Csak a jogosultságot kell megadni neki.
#
#     permissions:
#       contents: read
#       packages: write          # <- ez kell az image feltöltéséhez
#
#     - name: Belépés a GHCR-be
#       uses: docker/login-action@v3
#       with:
#         registry: ghcr.io
#         username: ${{ github.actor }}
#         password: ${{ secrets.GITHUB_TOKEN }}
#
#         # A build lépésben pedig:
#         push: true
#         tags: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
#
# Az image ezután a repo "Packages" szekciójában jelenik meg. Figyelem: a
# GHCR csak kisbetűs nevet fogad el, tehát ha a GitHub felhasználónévben nagy
# betű van, azt előbb kisbetűsíteni kell.
#
# ----------------------------------------------------------------------------
# B) Docker Hub - a legismertebb publikus registry
# ----------------------------------------------------------------------------
# Itt már saját fiók és két repository secret kell:
#   DOCKERHUB_USERNAME  - a Docker Hub felhasználónév
#   DOCKERHUB_TOKEN     - Access Token (Docker Hub > Account Settings >
#                         Personal access tokens), NEM a fiók jelszava
#
#     - name: Belépés a Docker Hubra
#       uses: docker/login-action@v3
#       with:
#         username: ${{ secrets.DOCKERHUB_USERNAME }}
#         password: ${{ secrets.DOCKERHUB_TOKEN }}
#
#         push: true
#         tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dedih-demo:${{ steps.tag.outputs.value }}
#
# Azért access token és nem jelszó, mert a token visszavonható anélkül, hogy
# a fiók jelszavát cserélni kellene, és korlátozható a jogosultsága.
#
# ----------------------------------------------------------------------------
# C) Azure Container Registry (ACR) - vállalati, privát registry
# ----------------------------------------------------------------------------
# Két út van. Az egyszerűbb ugyanaz a minta, mint fent, felhasználónévvel és
# jelszóval:
#
#     - name: Belépés az ACR-be
#       uses: docker/login-action@v3
#       with:
#         registry: <container-registry-neve>.azurecr.io
#         username: ${{ secrets.ACR_USERNAME }}
#         password: ${{ secrets.ACR_PASSWORD }}
#
#         push: true
#         tags: <container-registry-neve>.azurecr.io/dedih-demo:${{ steps.tag.outputs.value }}
#
# A korszerűbb megoldás viszont OIDC federated credential: ilyenkor egyáltalán
# NINCS tárolt jelszó. A GitHub futás közben kap egy rövid életű tokent, amit
# az Azure ellenőriz, és ami percek alatt lejár.
#
#     permissions:
#       contents: read
#       id-token: write          # <- ez kell az OIDC tokenhez
#
#     - name: Bejelentkezés az Azure-ba (OIDC, jelszó nélkül)
#       uses: azure/login@v2
#       with:
#         client-id: ${{ secrets.AZURE_CLIENT_ID }}
#         tenant-id: ${{ secrets.AZURE_TENANT_ID }}
#         subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
#
#     - name: ACR login
#       run: az acr login --name <container-registry-neve>
#
# Ez a secret-ek blokkjának a folytatása: a legbiztonságosabb titok az, ami
# nem is létezik. Amit nem tárolunk, azt nem is lehet kiszivárogtatni.
#
# ----------------------------------------------------------------------------
# D) Ami a push után szokott jönni
# ----------------------------------------------------------------------------
#   - Image vizsgálat: a trivy vagy a grype végigmegy az image-ben lévő
#     csomagokon és jelzi az ismert CVE-ket. Ugyanaz, amit a pip-audit csinál
#     a requirements.txt-vel, csak az egész operációs rendszer rétegre.
#     Érdemes a push ELŐTT futtatni, hogy sérülékeny image ki se kerüljön.
#   - SBOM (Software Bill of Materials): tételes lista arról, mi van az
#     image-ben. A build-push-action tudja generálni (sbom: true).
#   - Aláírás: a cosign digitális aláírással látja el az image-et, így a
#     futtató környezet ellenőrizni tudja, hogy tényleg a mi pipeline-unk
#     építette, és senki nem cserélte ki.
#   - Deploy: a registry-ből a futtató környezet húzza le az image-et. Ez már
#     a CD (continuous deployment) rész, ami külön workflow szokott lenni.
#   - Több architektúra: platforms: linux/amd64,linux/arm64 megadásával
#     Apple Silicon gépeken is futtatható image készül. Ilyenkor a load: true
#     nem működik, mert egyszerre több image készül.
# ----------------------------------------------------------------------------